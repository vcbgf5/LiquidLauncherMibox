name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the freshly built APK to (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write   # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      # Fixed file name, so .../releases/latest/download/LiquidTV.apk always works.
      - name: Name the APK
        run: cp app/build/outputs/apk/release/*.apk LiquidTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-tv-apk
          path: LiquidTV.apk

      - name: Attach APK to the release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: LiquidTV.apk
