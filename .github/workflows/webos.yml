name: webOS package

# Builds the clickable preview (preview/src, tools/build_preview.py) and packs it as an LG webOS app, for testing the look on an LG TV.
on:
  workflow_dispatch:
  push:
    paths:
      - "webos/**"
      - "preview/**"
      - "tools/build_preview.py"
      - ".github/workflows/webos.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package
        run: |
          python3 tools/build_preview.py
          npm install -g @webos-tools/cli
          mkdir -p out
          ares-package webos --outdir out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-tv-webos-ipk
          path: out/*.ipk
