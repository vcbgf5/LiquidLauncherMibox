name: Wallpapers

# Manual run: download photos from Unsplash into wallpapers/ (needs the UNSPLASH_ACCESS_KEY secret).
# Any push that changes files in wallpapers/ rebuilds wallpapers/index.json, the list the app reads.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wallpapers/**"
      - "!wallpapers/index.json"
      - "tools/wallpaper_categories.json"

permissions:
  contents: write

concurrency:
  group: wallpapers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download photos from Unsplash
        if: github.event_name == 'workflow_dispatch'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PER_CATEGORY: "20"
        run: python3 tools/fetch_unsplash.py

      - name: Rebuild index.json
        run: python3 tools/build_wallpaper_index.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpapers
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update wallpapers"
            git pull --rebase origin main
            git push
          fi
