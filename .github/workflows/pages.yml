name: Site

# Builds the download page (site/) and publishes it to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'preview/**'
      - 'tools/build_preview.py'
      - 'app/src/main/java/com/liquidglass/tvlauncher/data/Changelog.kt'
      - 'docs/*.jpg'
      - '.github/workflows/pages.yml'
  # A new build (and with it a new release) refreshes the version numbers on the page.
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/img out/apk
          cp -r site/. out/
          cp docs/preview-*.jpg out/img/
          touch out/.nojekyll
          sed -i "s/__BUILT__/$(date -u +'%Y-%m-%d')/" out/index.html
          # A copy of the release list, so visitors do not depend on the GitHub API rate limit.
          gh api "repos/${{ github.repository }}/releases?per_page=8" \
            --jq '[.[] | select((.draft | not) and (.prerelease | not)) | {tag_name, published_at, assets: [.assets[] | {name, size, browser_download_url}]}]' \
            > out/releases.json || echo '[]' > out/releases.json
          head -c 400 out/releases.json; echo
          # The clickable preview, showing the version of the newest release.
          VER=$(python3 -c "import json;print(json.load(open('out/releases.json'))[0]['tag_name'])" 2>/dev/null || cat preview/src/version.txt)
          python3 tools/build_preview.py --version "$VER" --out out/preview.html
          find out -type f | sort

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add ../pages origin/gh-pages --detach
          rsync -a --delete --exclude '.git' out/ ../pages/
          cd ../pages
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged"
          else
            git commit -m "Update site"
            git push origin HEAD:gh-pages
          fi
