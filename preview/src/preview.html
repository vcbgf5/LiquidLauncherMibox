<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquid TV: klikalny podgląd</title>
<meta name="description" content="Klikalny podgląd launchera Liquid TV: ekran główny, aplikacje, widżety, ustawienia i szybkie ustawienia. Strzałki, Enter i Esc działają jak pilot.">
<style>
:root{color-scheme:dark;--accent:#0a84ff;--accent-rgb:10,132,255;--tint:255,255,255}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:Roboto,"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit}
#wrap{position:relative;flex:1;min-height:0}
#stage{position:absolute;left:50%;top:50%;width:960px;height:540px;margin:-270px 0 0 -480px;overflow:hidden;background:#07080b;border-radius:6px;transform-origin:50% 50%;user-select:none;-webkit-user-select:none;--p:0;box-shadow:0 30px 90px rgba(0,0,0,.7)}
#stage[data-page=info]{--p:-1}
#stage[data-page=apps]{--p:1}

/* wallpaper: two layers that cross-fade, breathing zoom and a drift that follows the dock */
#wall{position:absolute;inset:-26px;transform:translateX(var(--px,0px));transition:transform .8s cubic-bezier(.22,1,.36,1)}
#wallzoom{position:absolute;inset:0;animation:breathe 26s linear infinite alternate}
#wall img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
#wall img.on{opacity:1}
#wall.builtin img{opacity:0}
#wall.builtin{background:radial-gradient(120% 90% at 30% 20%,#3b4a7a,#161a2c 55%,#07080b)}
#scrim{position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0) 34%,rgba(0,0,0,0) 56%,rgba(0,0,0,.32))}
#stage.bright #scrim{background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.1) 40%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.5))}
#shade{position:absolute;inset:-1px;background:rgba(12,14,18,.9);opacity:0;transition:opacity .6s ease;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
#stage:not([data-page=home]) #shade{opacity:1}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tileIn{from{opacity:0;transform:translateY(28px) scale(.85)}to{opacity:1;transform:none}}
@keyframes tileUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes dockIn{from{opacity:0;transform:translateX(-50%) translateY(40px) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
@keyframes sheen{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
@keyframes spin{to{transform:rotate(360deg)}}

.page{position:absolute;inset:0;transform:translateY(calc((var(--o) - var(--p)) * 540px));transition:transform .7s cubic-bezier(.22,1,.36,1)}
#info{--o:-1}#home{--o:0}#apps{--o:1}

/* home */
.glass{font-weight:700;color:transparent;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.32));-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px rgba(255,255,255,.8)}
#bigclock{position:absolute;left:0;right:0;top:78px;text-align:center;pointer-events:none;transition:top .5s cubic-bezier(.22,1,.36,1),opacity .4s}
#bigclock.mid{top:128px}
#bigclock .t{font-size:124px;line-height:1;letter-spacing:-3px;filter:drop-shadow(0 4px 24px rgba(0,0,0,.22))}
#bigclock .d{font-size:21px;font-weight:600;margin-top:2px;color:rgba(255,255,255,.92);text-shadow:0 2px 12px rgba(0,0,0,.5)}
#bigclock .w{font-size:17px;font-weight:500;margin-top:4px;color:rgba(255,255,255,.85);text-shadow:0 2px 12px rgba(0,0,0,.5)}
#stage:not(.bigclock) #bigclock{opacity:0}
#topbar{position:absolute;top:0;right:0;padding:26px 48px;display:flex;flex-direction:column;align-items:flex-end;z-index:5}
#toprow{display:flex;align-items:center;gap:16px}
#smallclock{font-size:18px;font-weight:500;text-shadow:0 2px 10px rgba(0,0,0,.55)}
#stage.bigclock #smallclock{display:none}
.rbtn{position:relative;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,0);display:grid;place-items:center;cursor:pointer;transition:transform .22s cubic-bezier(.2,.9,.25,1.2),background .16s,border-color .16s}
.rbtn.ico{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25)}
.rbtn.focus{transform:scale(1.15);background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.92)}
.rbtn.open{background:rgba(255,255,255,.14)}
.rbtn svg{display:block}
.rbtn .dot,.row .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#ff5a4f}
#stage.iconbar .only-min{display:none}
#stage:not(.iconbar) .only-icons{display:none}
.avatar{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#7c9cff,#b36bff);display:grid;place-items:center;font-weight:700;font-size:18px}
#tdrop{display:none;margin-top:10px;width:300px;border-radius:18px;padding:8px;background:rgba(var(--glass-rgb,28,30,38),.9);border:1px solid rgba(255,255,255,.22);box-shadow:0 20px 50px rgba(0,0,0,.5)}
#tdrop.open{display:block;animation:rise .26s cubic-bezier(.2,.9,.25,1.1)}

.dock{--t:.6;position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;gap:16px;padding:26px 28px;width:max-content;border-radius:32px;
  background:linear-gradient(160deg,rgba(var(--tint),calc(.04 + .14*(1 - var(--t)))),rgba(var(--tint),calc(.02 + .04*(1 - var(--t))))),rgba(0,0,0,calc(.18*(1 - var(--t))));
  -webkit-backdrop-filter:blur(calc(26px - 14px*var(--t))) saturate(150%);backdrop-filter:blur(calc(26px - 14px*var(--t))) saturate(150%);
  border:1px solid rgba(255,255,255,calc(.30 - .08*var(--t)));box-shadow:0 22px 50px rgba(0,0,0,.5);animation:dockIn .9s cubic-bezier(.2,.9,.25,1.15) .08s backwards;transition:width .3s}
.dock .tile{width:var(--tw,128px);flex:none;position:relative;animation:tileIn .8s cubic-bezier(.2,.9,.25,1.2) backwards;animation-delay:calc(.22s + var(--i)*.07s)}
.dock .label{position:absolute;left:0;right:0;top:100%}

/* tiles */
.tile{display:flex;flex-direction:column;cursor:pointer;transition:transform .24s cubic-bezier(.2,.9,.25,1.2)}
.art{position:relative;aspect-ratio:5/3;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:box-shadow .24s;background:#222}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.4) 50%,transparent 68%)}
#stage.light .art::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,0) 45%,rgba(0,0,0,.14))}
.tile.focus .art::after{animation:sheen .75s cubic-bezier(.4,0,.2,1)}
.fgrid .tile.f{transform:translateY(-6px) scale(1.1);z-index:6}
.fgrid .tile.f .art{box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.92),0 0 28px 3px rgba(var(--accent-rgb),.4)}
.tile.focus{transform:perspective(520px) translateY(-8px) scale(1.14) rotateY(var(--ry,0deg));z-index:6}
.tile.focus .art{box-shadow:0 18px 38px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.92),0 0 34px 4px rgba(var(--accent-rgb),.4)}
.tile.press{transform:translateY(-8px) scale(1.06) !important}
.label{height:18px;margin-top:8px;font-size:12.5px;font-weight:600;text-align:center;white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile.focus .label{opacity:1;transform:none}
.art.folder{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.26)}
.art.folder img{border-radius:5px;aspect-ratio:5/3;height:auto}

/* apps page */
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);gap:14px 18px;padding:48px 48px 40px;align-content:start;overflow-y:auto;scrollbar-width:none;scroll-behavior:smooth}
.grid::-webkit-scrollbar{display:none}
#stage[data-page=apps] .grid .tile{animation:tileUp .6s cubic-bezier(.2,.9,.25,1.1) backwards;animation-delay:calc(.1s + var(--row)*.06s)}

/* widgets page */
.iw{position:absolute;inset:0;padding:34px 48px 30px;display:flex;flex-direction:column}
.itop{flex:1;min-height:0}
.itop .t{font-size:92px;font-weight:300;letter-spacing:-2px;line-height:1.05}
.itop .d{font-size:21px;font-weight:500;color:rgba(255,255,255,.88);margin-top:4px}
#wrow{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth;padding:8px 6px 10px;margin:0 -6px}
#wrow::-webkit-scrollbar{display:none}
.wcard{flex:none;height:222px;border-radius:24px;padding:16px 18px;cursor:pointer;background:linear-gradient(rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.17);transition:transform .22s cubic-bezier(.2,.9,.25,1.2),box-shadow .22s,border-color .22s;overflow:hidden}
.wcard.focus{transform:scale(1.025);border-color:rgba(255,255,255,.95);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 18px 40px rgba(0,0,0,.5)}
#stage[data-page=info] .wcard{animation:tileUp .6s cubic-bezier(.2,.9,.25,1.1) backwards;animation-delay:calc(.2s + var(--i)*.06s)}
.wcard h5{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.w-cal{width:296px}.w-wx{width:316px}.w-np{width:270px}.w-ag{width:300px}.w-net{width:250px}.w-bt{width:260px}.w-sys{width:250px}
.cal h6{margin:0 0 4px 2px;font-size:15px;font-weight:500}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .g i{font-style:normal;height:24px;display:grid;place-items:center;font-size:12px;font-weight:500}
.cal .g i.h{font-size:10.5px;color:rgba(255,255,255,.55)}
.cal .g i.t b{width:23px;height:23px;border-radius:50%;background:#fff;color:#111;font-weight:700;display:grid;place-items:center}
.wx-now{display:flex;align-items:center;gap:12px}.wx-now .big{font-size:44px;font-weight:300;line-height:1}
.wx-now svg{width:54px;height:40px}
.wx-sub{font-size:12px;color:rgba(255,255,255,.72);margin:4px 0 8px}
.wx-days{display:flex;justify-content:space-between;text-align:center;font-size:11px;color:rgba(255,255,255,.8)}
.wx-days svg{width:30px;height:24px;display:block;margin:2px auto}
.np-cover{width:78px;height:78px;border-radius:14px;background:linear-gradient(135deg,#7c9cff,#b36bff 60%,#ff7a9a);display:grid;place-items:center;font-size:32px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.np-t{font-size:16px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np-a{font-size:12.5px;color:rgba(255,255,255,.7)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}
.np-h{font-size:10.5px;color:rgba(255,255,255,.5);margin-top:8px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}.kv span{color:rgba(255,255,255,.62)}
.ev{font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}.ev b{display:block;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.4px}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.46)}
.ov.open{display:flex}
.ov.clear{background:transparent}
.cardx{background:rgba(var(--glass-rgb,28,30,38),.93);border:1px solid rgba(255,255,255,.22);border-radius:26px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.9,.25,1.1)}
.cardx h4{margin:4px 8px 10px;font-size:20px;font-weight:700}
.cardx .sub{margin:-6px 8px 10px;font-size:12.5px;color:rgba(255,255,255,.6)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:4px 8px 12px}
.head h4{margin:0}.head small{font-size:12.5px;color:rgba(255,255,255,.55)}
.row{position:relative;display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;font-size:15px;cursor:pointer;color:rgba(255,255,255,.92)}
.row .lab{flex:1;min-width:0}
.row .st{font-size:13px;color:rgba(255,255,255,.6);white-space:nowrap}
.row.f{background:rgba(255,255,255,.93);color:#111;font-weight:600}.row.f .st{color:rgba(0,0,0,.6)}
.row .chev{font-size:20px;opacity:.6;line-height:1}
.row .arr{padding:0 6px;font-size:19px;opacity:.55;cursor:pointer}.row .arr:hover{opacity:1}
.row .ctl{display:flex;align-items:center;gap:8px}
.row .val{min-width:56px;text-align:center;font-weight:600;font-size:14px}
.row .mini{width:110px;height:6px;border-radius:3px;background:rgba(128,128,128,.4);overflow:hidden}.row .mini i{display:block;height:100%;background:var(--accent)}
.row.f .mini i{background:#111}
.sw{width:42px;height:25px;border-radius:13px;background:rgba(128,128,128,.45);position:relative;transition:background .18s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(17px)}
.cat-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.cat-ico svg{width:20px;height:20px}
.note{margin:2px 14px 8px;font-size:12px;line-height:1.45;color:rgba(255,255,255,.55)}
.sep{height:1px;background:rgba(255,255,255,.1);margin:4px 14px}
#settings .cardx{width:618px;padding:14px 14px 10px}
#settings .list{max-height:420px;overflow-y:auto;scrollbar-width:none;padding:4px;background:rgba(255,255,255,.04);border-radius:20px}
#settings .list::-webkit-scrollbar{display:none}
#settings .list .row{margin:1px 0}
.crumb{display:flex;align-items:center;gap:10px}.crumb .back{font-size:22px;opacity:.7}
.qgrid{display:grid;grid-template-columns:repeat(4,147px);gap:10px}
.qt{height:86px;border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.09);position:relative;cursor:pointer;transition:background .15s}
.qt .n{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}.qt .n i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}.qt.on .n i{background:var(--accent)}
.qt .s{position:absolute;left:12px;right:12px;bottom:10px;font-size:11.5px;color:rgba(255,255,255,.65)}
.qt.f{background:rgba(255,255,255,.93);color:#111}.qt.f .s{color:rgba(0,0,0,.62)}.qt.f .n i{background:rgba(0,0,0,.25)}.qt.f.on .n i{background:var(--accent)}
#menu .cardx{width:310px}
.fgrid{display:grid;grid-template-columns:repeat(4,140px);gap:16px 14px;padding:4px 6px 10px}
.fgrid .tile .label{opacity:1;transform:none}
.dlg .cardx{width:520px}
.dlg p{margin:0 8px 10px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.82)}
.dlg ul{margin:0 8px 12px;padding-left:20px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.86)}.dlg li{margin-bottom:6px}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{padding:11px 20px;border-radius:14px;background:rgba(255,255,255,.12);font-size:14px;font-weight:600;cursor:pointer}
.btn.f{background:rgba(255,255,255,.93);color:#111}
.rep{margin:0 8px 8px;font-size:13.5px;line-height:1.7;font-family:ui-monospace,Menlo,Consolas,monospace}.rep .ok{color:#43d675}.rep .no{color:#ff6b61}
.qr{display:flex;gap:18px;align-items:center;margin:0 8px 8px}.qr canvas{width:190px;height:190px;border-radius:12px;background:#fff;flex:none}
.qr .u{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;color:#9dbbff;margin-top:8px}
#vol{position:absolute;top:22px;left:50%;width:340px;padding:12px 16px;border-radius:20px;display:flex;align-items:center;gap:12px;background:rgba(30,32,42,.92);border:1px solid rgba(255,255,255,.22);box-shadow:0 14px 40px rgba(0,0,0,.5);transform:translate(-50%,-100px);transition:transform .35s cubic-bezier(.2,.9,.25,1.1);z-index:50;pointer-events:none}
#vol.on{transform:translate(-50%,0)}
#vol .tr{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}#vol .tr i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width .12s}
#vol b{width:44px;text-align:right;font-size:15px}
#toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,14px);max-width:760px;padding:10px 18px;border-radius:14px;background:rgba(20,22,30,.92);font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(20,22,30,.82);border:1px solid rgba(255,255,255,.2);font-size:13px;z-index:55;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#hint.off{opacity:0}
#launch{position:absolute;inset:0;z-index:70;visibility:hidden}#launch.on{visibility:visible}
#ldim{position:absolute;inset:0;background:#05060a;opacity:0}
#lart{position:absolute;overflow:hidden}#lart img{width:100%;height:100%;object-fit:cover;display:block}
#appview{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#appview.on{opacity:1}#appview b{font-size:26px}#appview span{font-size:14px;color:rgba(255,255,255,.65)}
#appview img{width:200px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6);margin-bottom:8px}
#saver{position:absolute;inset:0;z-index:80;opacity:0;pointer-events:none;transition:opacity 1.4s ease;background:#000;overflow:hidden;cursor:pointer}
#saver.on{opacity:1;pointer-events:auto}
#saver img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:svZoom 45s linear infinite alternate}
@keyframes svZoom{from{transform:scale(1.02)}to{transform:scale(1.12)}}
@keyframes svDrift{from{margin:-22px 0 0 -40px}to{margin:22px 0 0 40px}}
#saver .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.12) 50%,rgba(0,0,0,.4))}
#saver .clk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;animation:svDrift 40s ease-in-out infinite alternate;filter:drop-shadow(0 0 26px rgba(255,255,255,.25))}
#svtime{font-size:192px;line-height:1;letter-spacing:-4px}#svdate{font-size:33px;line-height:1.3;font-weight:600}
#boot{position:absolute;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#boot.on{display:flex}#boot .sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
#boot b{font-size:22px;letter-spacing:.5px}

/* Liquid Glass: frosted, saturated glass, a bright light-catching rim with a faint colour fringe, a soft sheen */
#stage.lg .cardx,#stage.lg #tdrop,#stage.lg #vol{
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 42%,rgba(255,255,255,.07)),rgba(var(--glass-rgb,28,30,38),.40);
  -webkit-backdrop-filter:blur(30px) saturate(1.9) brightness(1.06);backdrop-filter:blur(30px) saturate(1.9) brightness(1.06);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 32px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 1px 0 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(255,255,255,.1),inset 0 0 40px rgba(255,255,255,.05)}
#stage.lg.bright .cardx,#stage.lg.bright #tdrop,#stage.lg.bright #vol{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 42%,rgba(255,255,255,.06)),rgba(var(--glass-rgb,28,30,38),.58)}

<script>
(function(){'use strict';

const stage=$('#stage'), wrap=$('#wrap');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- scaling ---------- */

/* ---------- state (kept in localStorage so choices survive a reload) ---------- */
const DEF={glass:1,dockT:60,dockSize:100,accent:0,tint:0,topbar:'min',bigclock:true,clockContent:1,clockPos:0,parallax:true,tilt:true,light:true,perf:0,
  wall:'zima',wallInt:2,saver:0,auto:true,silent:true,updInt:0,widgets:{calendar:1,weather:1,np:1,spotify:1,agenda:0,network:0,bt:0,system:0},

const ACCENTS=[['Niebieski','10,132,255'],['Fioletowy','191,90,242'],['Zielony','48,209,88'],['Pomarańczowy','255,159,10'],['Różowy','255,55,95'],['Biały','255,255,255']];

/* ---------- toast / volume / hint ---------- */

function mute(){ ST.muted=!ST.muted; save(); showVol(); }
let hintT; function hideHint(){ $('#hint').classList.add('off'); }
hintT=setTimeout(hideHint,7000);

/* ---------- wallpaper ---------- */
let wallImg=0, curWall=null;
function pickWall(){ if(ST.wall==='all'){ const ks=WALLS.map(w=>w[0]).filter(k=>k!==curWall); return ks[Math.floor(Math.random()*ks.length)]; } return ST.wall; }
function setWall(k,instant){
  const off=(ST.wall==='off'); $('#wall').classList.toggle('builtin',off);
  if(off){ stage.classList.remove('bright'); curWall=null; return; }
  if(k===curWall && !instant) return;
  curWall=k; const imgs=[$('#w0'),$('#w1')]; wallImg=1-wallImg; const n=imgs[wallImg], o=imgs[1-wallImg];
  n.src=A['wall-'+k]; if(instant){ n.style.transition='none'; o.style.transition='none'; } n.classList.add('on'); o.classList.remove('on');
  if(instant) requestAnimationFrame(()=>{n.style.transition='';o.style.transition='';});

}
function nextWall(manual){
  if(ST.wall==='off'){ if(manual) toast('Wbudowana tapeta jest jedna'); return; }

const SVG={
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="#fff"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6" fill="#fff"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v6"/><path d="M7.5 6.2a8 8 0 1 0 9 0"/></svg>',
  term:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5"/><path d="M12 18h7"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke-linecap="round"/></svg>',

};
$('#b-wifi').innerHTML=SVG.wifi; $('#b-bt').innerHTML=SVG.bt; $('#b-menu').innerHTML=SVG.menu+'<i class="dot" style="display:none"></i>';

  const cloud='<path d="M9 22h15a5 5 0 0 0 .6-10 7 7 0 0 0-13.4-1.6A5.5 5.5 0 0 0 9 22z" fill="#c9cfdc"/>';

  const d=$('#dock'); d.innerHTML='';
  ST.favs.forEach((id,i)=>{const t=el('div','tile fav'); t.style.setProperty('--i',i); t.dataset.id=id; t.dataset.name=appName(id); t.innerHTML='<div class="art"><img alt="" src="'+art(id)+'"></div><div class="label">'+appName(id)+'</div>'; d.appendChild(t);});

  if(axis==='x'){ const l=(r.left-b.left)/k, rr=(r.right-b.right)/k; if(l<0) box.scrollLeft+=l-24; else if(rr>0) box.scrollLeft+=rr+24; }

}

function nearestIdx(list,x){let b=0,bd=1e9; list.forEach((t,i)=>{const d=Math.abs(cx(t)-x); if(d<bd){bd=d;b=i;}}); return b;}

  $$('.focus').forEach(e=>e.classList.remove('focus')); if(S.app) return;
  const l=items(F.zone); F.i=clamp(F.i,0,Math.max(0,l.length-1)); const e=l[F.i]; if(!e) return; e.classList.add('focus'); if(F.zone==='dock') F.dockI=F.i;

const ovs=[];
const topOv=()=>ovs[ovs.length-1];
function openOv(o){ o.idx=o.idx||0; o.cols=o.cols||1; if(!o.el){o.el=el('div','ov'+(o.cls?' '+o.cls:'')); if(o.id) o.el.id=o.id; stage.insertBefore(o.el,$('#vol')); o._made=true;} o.el.classList.add('open'); ovs.push(o); return o; }
function closeOv(o){ const i=ovs.indexOf(o); if(i>=0) ovs.splice(i,1); o.el.classList.remove('open'); if(o._made) o.el.remove(); if(o.onClose) o.onClose(); }

function setItems(o,list,keep){ o.items=list; o.items.forEach((e,i)=>{ e.addEventListener('pointermove',ev=>{ if(topOv()===o&&o.idx!==i&&(ev.movementX||ev.movementY)) focusOv(o,i); }); }); focusOv(o,keep==null?o.idx:keep); }
function focusOv(o,i){ if(!o.items.length) return; o.idx=clamp(i,0,o.items.length-1); o.items.forEach((e,k)=>e.classList.toggle('f',k===o.idx)); const e=o.items[o.idx]; if(e) reveal(e.closest('.list'),e,'y'); }
function ovKey(o,k){
  if(k==='back'||(k==='menu'&&!o.keepMenu)){ o.back?o.back():closeOv(o); return; }
  if(o.onKey&&o.onKey(k)) return;
  if(k==='home'){ closeAll(); return; }
  const n=o.items.length; if(!n){ if(k==='ok') closeOv(o); return; }
  let i=o.idx; const e=o.items[i];
  if(k==='ok'){ if(e._ok) e._ok(); return; }
  if(o.cols>1){
    if(k==='left'&&i%o.cols>0) i--; else if(k==='right'&&i%o.cols<o.cols-1&&i+1<n) i++;
    else if(k==='up'&&i-o.cols>=0) i-=o.cols; else if(k==='down'&&i+o.cols<n) i+=o.cols;
    else if(k==='down'&&i+o.cols>=n&&Math.floor(i/o.cols)<Math.floor((n-1)/o.cols)) i=n-1;
  } else {
    if(k==='up') i=Math.max(0,i-1); else if(k==='down') i=Math.min(n-1,i+1); else if((k==='left'||k==='right')&&e._step) e._step(k==='left'?-1:1);
  }
  focusOv(o,i);
}

const SPI={shuffle:'<svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>',prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>',next:'<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'};
function openSpotify(){
  const ov=openOv({id:'spotify',cls:'sp'}); let view=null;
  ov.back=()=>{ if(view!==null){ view=null; ov.draw(4+ov.lastList); } else closeOv(ov); };
  ov.lastList=0;
  ov.draw=(focus)=>{
    const T=SP_TRACKS[sp.track];
    const ctl=[['shuffle',SPI.shuffle,sp.shuffle,()=>{sp.shuffle=!sp.shuffle}],['prev',SPI.prev,false,()=>{sp.track=(sp.track+SP_TRACKS.length-1)%SP_TRACKS.length;sp.pos=0}],['play',sp.playing?SPI.pause:SPI.play,false,()=>{sp.playing=!sp.playing}],['next',SPI.next,false,()=>{sp.track=(sp.track+1)%SP_TRACKS.length;sp.pos=0}]];
    let right='';
    if(view===null) right='<h4>Twoje playlisty</h4><div class="spgrid">'+SP_LISTS.map((l,i)=>'<div class="sptile fxs" data-i="'+i+'"><div class="cv" style="'+spCover(i)+'">♪</div><b>'+l[0]+'</b><span>'+(8+i*3)+' utworów</span></div>').join('')+'</div>';
    else right='<h4 style="display:flex;justify-content:space-between;gap:12px"><span>'+SP_LISTS[view][0]+'</span></h4><div class="sppill fxs" data-play="1">Odtwórz playlistę</div><div class="sptracks list">'+SP_TRACKS.map((t,j)=>'<div class="sprow fxs'+(sp.list===view&&sp.track===j?' now':'')+'" data-j="'+j+'"><i>'+(sp.list===view&&sp.track===j?'♪':j+1)+'</i><div class="t"><b>'+t[0]+'</b><em>'+t[1]+'</em></div><span>'+t[2]+'</span></div>').join('')+'</div>';
    ov.el.innerHTML='<div class="spwrap"><div class="spl"><div class="spc" style="'+spCover(sp.list)+'">♪</div><h3>'+T[0]+'</h3><p>'+T[1]+'</p><div class="bar"><i class="spp" style="width:'+(sp.pos*100)+'%;background:#fff"></i></div><div class="spctl">'+ctl.map((c,i)=>'<div class="sbtn fxs'+(i===2?' big':'')+(c[2]?' on':'')+'" data-c="'+i+'">'+c[1]+'</div>').join('')+'</div><small>na: Mi Box S</small></div><div class="spr">'+right+'</div></div>';
    const els=$$('.fxs',ov.el); els.forEach((e,idx)=>{
      e._ok=()=>{
        if(e.dataset.c!==undefined){ ctl[+e.dataset.c][3](); refreshSp(); toast(['Losowo','Poprzedni utwór','','Następny utwór'][+e.dataset.c]||(sp.playing?'Wznawiam':'Pauza')); }
        else if(e.dataset.i!==undefined){ ov.lastList=+e.dataset.i; view=+e.dataset.i; ov.draw(4); }
        else if(e.dataset.play){ sp.list=view; sp.track=0; sp.pos=0; sp.playing=true; refreshSp(); }
        else if(e.dataset.j!==undefined){ sp.list=view; sp.track=+e.dataset.j; sp.pos=0; sp.playing=true; refreshSp(); }
      };
      e.addEventListener('click',()=>{ focusOv(ov,idx); e._ok(); });
    });
    setItems(ov,els,focus);
  };
  ov.onKey=(k)=>{
    if(!['left','right','up','down'].includes(k)) return false;
    const i=ov.idx, n=ov.items.length;
    if(i<4){ if(k==='right') focusOv(ov,i===3?4:i+1); else if(k==='left') focusOv(ov,Math.max(0,i-1)); return true; }
    const j=i-4;
    if(view===null){
      const col=j%3;
      if(k==='left') focusOv(ov,col===0?2:i-1);
      else if(k==='right'){ if(col<2&&i+1<n) focusOv(ov,i+1); }
      else if(k==='up'){ if(j>=3) focusOv(ov,i-3); }
      else if(k==='down'){ if(i+3<n) focusOv(ov,i+3); else if(Math.floor(j/3)<Math.floor((n-5)/3)) focusOv(ov,n-1); }
    } else {
      if(k==='left') focusOv(ov,2); else if(k==='up') focusOv(ov,Math.max(4,i-1)); else if(k==='down') focusOv(ov,Math.min(n-1,i+1));
    }
    return true;
  };
  ov.draw(2);
}

/* phone remote (QR) */
function qrCanvas(text){
  const N=33, c=document.createElement('canvas'); c.width=c.height=N*8+16; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.fillStyle='#111';
  let h=2166136261; for(const ch of text){h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5; return ((h>>>0)%1000)/1000;};
  const fin=(ox,oy)=>{ for(let i=0;i<7;i++)for(let j=0;j<7;j++){ const edge=i===0||j===0||i===6||j===6, core=i>=2&&i<=4&&j>=2&&j<=4; if(edge||core) x.fillRect(8+(ox+i)*8,8+(oy+j)*8,8,8);} };
  const inFin=(i,j)=>(i<8&&j<8)||(i>=N-8&&j<8)||(i<8&&j>=N-8);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){ if(inFin(i,j)) continue; if(rnd()>.52) x.fillRect(8+i*8,8+j*8,8,8); }
  fin(0,0); fin(N-7,0); fin(0,N-7); return c;
}

function openSettings(cat){
  const ov=openOv({id:'settings',cat:cat||null,saved:0}); const card=el('div','cardx'); ov.el.innerHTML=''; ov.el.appendChild(card);
  ov.back=()=>{ if(ov.cat){ ov.cat=null; ov.render(ov.saved); } else closeOv(ov); };
  ov.render=(keep)=>{
    const prev=$('.list',card), prevTop=prev&&ov._lastCat===ov.cat?prev.scrollTop:0; ov._lastCat=ov.cat;
    card.innerHTML=''; const cats=SET_CATS();
    if(!ov.cat){
      card.innerHTML='<div class="head"><h4>Ustawienia launchera</h4><small>Liquid TV · wersja '+VERSION+'</small></div><div class="list"></div>';
      const list=$('.list',card); const its=cats.map((c,i)=>{ const r=el('div','row','<span class="cat-ico" style="background:'+c.color+'">'+SVG[c.icon]+'</span><span class="lab">'+c.name+'</span><span class="st">'+c.state()+'</span><span class="chev">›</span>'); r._ok=()=>{ov.saved=i; ov.cat=c.id; ov.render(0);}; r.addEventListener('click',r._ok); list.appendChild(r); if(i<cats.length-1&&i>0) r.style.boxShadow='none'; return r;});
      setItems(ov,its,keep||0);
    } else {
      const c=cats.find(x=>x.id===ov.cat);
      card.innerHTML='<div class="head"><h4 class="crumb"><span class="back">‹</span>'+c.name+'</h4><small>Liquid TV · wersja '+VERSION+'</small></div><div class="list"></div>';
      const list=$('.list',card); const its=[];
      c.rows().forEach(d=>{
        if(d.type==='note'){ list.appendChild(el('div','note',d.text)); return; }
        if(d.type==='sep'){ list.appendChild(el('div','sep')); return; }
        const r=el('div','row'); r.innerHTML='<span class="lab">'+d.label+'</span>';
        const redraw=()=>ov.render(its.indexOf(r)>=0?its.indexOf(r):ov.idx);
        const set=(v)=>{ d.set(v); save(); applyAll(); redraw(); };
        if(d.type==='toggle'){ r.insertAdjacentHTML('beforeend','<span class="sw'+(d.get()?' on':'')+'"></span>'); r._ok=()=>set(!d.get()); r._step=()=>set(!d.get()); }
        else if(d.type==='slider'){ const v=d.get(); r.insertAdjacentHTML('beforeend','<span class="ctl"><span class="arr" data-d="-1">‹</span><span class="mini"><i style="width:'+((v-d.min)/(d.max-d.min)*100)+'%"></i></span><span class="val">'+d.fmt(v)+'</span><span class="arr" data-d="1">›</span></span>'); r._step=dir=>set(clamp(d.get()+d.step*dir,d.min,d.max)); r._ok=()=>r._step(1); }
        else if(d.type==='choice'){ const i=d.opts.findIndex(o=>o[0]===d.get()); r.insertAdjacentHTML('beforeend','<span class="ctl"><span class="arr" data-d="-1">‹</span><span class="val" style="min-width:150px">'+d.opts[Math.max(0,i)][1]+'</span><span class="arr" data-d="1">›</span></span>'); r._step=dir=>set(d.opts[(Math.max(0,i)+dir+d.opts.length)%d.opts.length][0]); r._ok=()=>r._step(1); }
        else { if(d.state) r.insertAdjacentHTML('beforeend','<span class="st">'+d.state+'</span>'); r._ok=()=>{ if(d.fn) d.fn(ov); }; }
        $$('.arr',r).forEach(a=>a.addEventListener('click',ev=>{ev.stopPropagation(); focusOv(ov,its.indexOf(r)); r._step(+a.dataset.d);}));
        r.addEventListener('click',()=>{ focusOv(ov,its.indexOf(r)); r._ok(); });
        list.appendChild(r); its.push(r);
      });
      setItems(ov,its,keep||0); list.scrollTop=prevTop; focusOv(ov,keep||0);
    }
  };
  ov.render(0); if(cat) {}
  ov.el.addEventListener('click',ev=>{ if(!ev.target.closest('.cardx')) closeOv(ov); });
}

function checkUpdate(){ updMsg='sprawdzanie…'; refreshSettings(); setTimeout(()=>{updMsg='masz najnowszą wersję ('+VERSION+')'; refreshSettings(); toast('Masz najnowszą wersję: '+VERSION);},900); }
function refreshSettings(){ const o=ovs.find(x=>x.id==='settings'); if(o&&o.render) o.render(o.idx); }
function setupAdb(){ toast('Łączę z adb i nadaję uprawnienia…',1500); setTimeout(()=>openReport('Konfiguracja adb',[['ok','Połączenie z adb (127.0.0.1:5555)'],['ok','Uprawnienia: zapis ustawień zabezpieczonych, kalendarz, Bluetooth'],['ok','Instalowanie aktualizacji w tle'],['ok','Usługa dostępności Liquid TV włączona'],['ok','Dostęp do powiadomień (widżet „Teraz gra”)'],['ok','Ciche aktualizacje włączone']]),1500); }

/* ---------- apply settings to the stage ---------- */
function applyAll(){
  const r=stage.style, a=ACCENTS[ST.accent][1]; document.documentElement.style.setProperty('--accent','rgb('+a+')'); document.documentElement.style.setProperty('--accent-rgb',a);
  const dock=$('#dock'); dock.style.setProperty('--t',ST.dockT/100); dock.style.setProperty('--tw',Math.min(128*ST.dockSize/100,129.3)+'px');
  const lite=ST.perf===1; stage.classList.toggle('lite',lite); stage.classList.toggle('lg',ST.glass===1&&!lite);
  document.documentElement.style.setProperty('--glass-rgb',GLASS_RGB[ST.tint]);
  stage.classList.toggle('iconbar',ST.topbar==='icons'); stage.classList.toggle('bigclock',!!ST.bigclock);
  $('#bigclock').classList.toggle('mid',ST.clockPos===1);
  stage.classList.toggle('noparallax',!ST.parallax||lite); stage.classList.toggle('notilt',!ST.tilt||lite); stage.classList.toggle('light',!!ST.light);
  document.documentElement.style.setProperty('--ry','0deg');
  tick(); armSaver(); topbarSync();
}
function topbarSync(){ if(F.zone==='top'&&!topItems().length){F.zone='dock';F.i=0;} paintFocus(); }

/* ---------- screensaver ---------- */
let saverOn=false, idleT;
function showSaver(){ $('#svimg').src=A['wall-'+(curWall||'zima')]; tick(); saverOn=true; $('#saver').classList.add('on'); }
function hideSaver(){ saverOn=false; $('#saver').classList.remove('on'); }
$('#saver').addEventListener('click',hideSaver);
function armSaver(){ clearTimeout(idleT); if(ST.saver>0&&!saverOn) idleT=setTimeout(()=>{ if(!S.busy) {closeAll(); showSaver();} },ST.saver*60000); }

/* ---------- input ---------- */
let holdT=null, holdFired=false;
function key(k){
  hideHint(); armSaver();
  if(k==='volup'){volume(1);return;} if(k==='voldown'){volume(-1);return;} if(k==='mute'){mute();return;}
  if(saverOn){ hideSaver(); return; }
  if(k==='saver'){ closeAll(); showSaver(); return; }
  if(S.busy) return;
  if(S.app){ if(k==='back'||k==='home') closeApp(); else if(k==='menu'||k==='hold') toast('Menu w aplikacji należy do aplikacji'); return; }
  const o=topOv();
  if(o){ if(k==='hold') k='ok'; ovKey(o,k); return; }
  if(k==='home'){ if(S.page!=='home') go('home'); else {F.zone='dock';F.i=0;paintFocus();} return; }
  if(k==='back'){ if(S.page!=='home') go('home'); else if(F.zone==='top'){F.zone='dock';paintFocus();} else toast('Wstecz: launcher zostaje na ekranie głównym'); return; }
  if(k==='menu'){ openQuick(); return; }
  if(k==='hold'){ const e=curEl(); if(!e) return; if(e._hold) e._hold(); else if(e.classList.contains('tile')) openContext(e); else if(e.id==='b-set'||e.id==='b-menu') openQuick(); else activate(e); return; }
  if(k==='ok'){ activate(curEl()); return; }
  pageKey(k);
}
function okDown(){ holdFired=false; clearTimeout(holdT); holdT=setTimeout(()=>{holdFired=true; key('hold');},520); }
function okUp(){ clearTimeout(holdT); if(!holdFired) key('ok'); holdFired=false; }
const KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Escape:'back',Backspace:'back',m:'menu',M:'menu',ContextMenu:'menu',h:'home',H:'home',Home:'home','+':'volup','=':'volup','-':'voldown','_':'voldown','0':'mute',x:'mute',s:'saver',S:'saver'};
const KC={461:'back',10009:'back',415:'ok',13:'ok'};
let enterDown=false;
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!enterDown){enterDown=true; okDown();} return; }
  const k=KEYS[e.key]||KC[e.keyCode]; if(k){ e.preventDefault(); key(k); }
});
addEventListener('keyup',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(enterDown){enterDown=false; okUp();} } });
$$('#remote button').forEach(b=>{
  const k=b.dataset.k;
  if(k==='ok'){ b.addEventListener('pointerdown',e=>{e.preventDefault(); b.classList.add('dn'); okDown();}); const up=()=>{ if(b.classList.contains('dn')){b.classList.remove('dn'); okUp();} }; b.addEventListener('pointerup',up); b.addEventListener('pointerleave',()=>{ if(b.classList.contains('dn')){b.classList.remove('dn'); clearTimeout(holdT);} }); }
  else b.addEventListener('click',()=>key(k));
});
stage.addEventListener('pointermove',()=>armSaver());
let wheelT=0; wrap.addEventListener('wheel',e=>{ const n=Date.now(); if(n-wheelT<260) return; if(Math.abs(e.deltaY)<8) return; wheelT=n; key(e.deltaY>0?'down':'up'); e.preventDefault(); },{passive:false});

/* pointer: hover moves the focus (like a Magic Remote), a click opens, right click or long touch = app menu */
function locate(e){ for(const z of ['top','dock','grid','info']){ const l=items(z); const i=l.indexOf(e); if(i>=0) return [z,i]; } return null; }
stage.addEventListener('pointermove',e=>{ if(topOv()||S.busy||saverOn||S.app||(!e.movementX&&!e.movementY)) return; const t=e.target.closest('.tile,.wcard,.fx-top'); if(!t) return; const loc=locate(t); if(!loc) return; const ok=(loc[0]==='grid')===(S.page==='apps')&&((loc[0]==='info')===(S.page==='info')); if(!ok) return; if(F.zone!==loc[0]||F.i!==loc[1]){ F.tilt=0; F.zone=loc[0]; F.i=loc[1]; paintFocus(); } });
stage.addEventListener('click',e=>{ if(topOv()||S.busy||saverOn||S.app) return; const t=e.target.closest('.tile,.wcard,.fx-top'); if(!t) return; const loc=locate(t); if(!loc) return; F.zone=loc[0]; F.i=loc[1]; paintFocus(); activate(t); });
stage.addEventListener('contextmenu',e=>{ e.preventDefault(); if(S.busy||saverOn||S.app) return; const t=e.target.closest('.tile'); if(t&&!topOv()){ const loc=locate(t); if(loc){F.zone=loc[0];F.i=loc[1];paintFocus();} openContext(t); } });
let touchT; stage.addEventListener('touchstart',e=>{ const t=e.target.closest('.tile'); if(!t) return; clearTimeout(touchT); touchT=setTimeout(()=>{ if(!topOv()&&!S.busy){ const loc=locate(t); if(loc){F.zone=loc[0];F.i=loc[1];paintFocus();} openContext(t); } },600); },{passive:true});
['touchend','touchmove','touchcancel'].forEach(n=>stage.addEventListener(n,()=>clearTimeout(touchT),{passive:true}));
stage.addEventListener('click',e=>{ if(e.target.closest('.ov')&&e.target.classList.contains('ov')){ const o=topOv(); if(o&&o!==drop&&o.id!=='settings') closeOv(o); } },true);
document.addEventListener('click',e=>{ if(!ovs.includes(drop)) return; if(!e.target.closest('#topbar')) drop.back(); });

/* ---------- start ---------- */
function start(){
  renderDock(); renderGrid(); renderInfo(); applyAll();
  setWall(ST.wall==='all'?pickWall():(ST.wall==='off'?null:ST.wall),true); armWall(); tick(); paintFocus();
  const s=qs.get('s');
  if(s==='apps') go('apps'); else if(s==='info') go('info');
  else if(s==='settings') openSettings(qs.get('c')||null);
  else if(s==='quick') openQuick();
  else if(s==='menu') {F.zone='top';F.i=0;paintFocus();toggleDrop();}
  else if(s==='saver') showSaver();
  else if(s==='folder') openFolder();
  else if(s==='news') openChangelog();
  else if(s==='qr') openRemote();
  else if(s==='spotify') openSpotify();
  if(qs.has('lite')){ST.perf=1;applyAll();}
  if(s) hideHint();
}
start();
})();
</script>
